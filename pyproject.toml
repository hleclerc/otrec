[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otrec"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "sdot",
    "torch",
    "numpy",
    "scipy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/otrec"]

[tool.hatch.build.targets.sdist]
only-include = ["src"]
